name: ballal
description: "BALLAL — mise en relation entre clients et professionnels. Amadou Technology."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  record: ^6.0.0
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  flutter_map: ^8.1.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo_ballal.png
    - assets/people/
