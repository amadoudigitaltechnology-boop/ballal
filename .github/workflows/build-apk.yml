# Génère l'APK Android de BALLAL sur les serveurs GitHub (gratuit).
# La configuration publique (URL + clé anon) est dans apps/mobile/env/dev.json.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les dossiers Android
        run: |
          flutter create --org com.amadoutechnology --project-name ballal --platforms android .
          python3 tool/setup_platforms.py || true

      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyse (erreurs bloquantes uniquement)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - name: Tests
        run: flutter test
        continue-on-error: true

      - name: Construire l'APK
        run: flutter build apk --release --dart-define-from-file=env/dev.json

      - uses: actions/upload-artifact@v4
        with:
          name: ballal-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK (page Releases, lien direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk BALLAL.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" BALLAL.apk --title "BALLAL – version de test ${{ github.run_number }}" \
            --notes "APK de test généré automatiquement depuis le commit ${{ github.sha }}." --latest
