# Génère l'APK Android de BALLAL sur les serveurs GitHub (gratuit).
# La configuration (URL + clé anon) vient des secrets GitHub SUPABASE_URL et SUPABASE_ANON_KEY :
# aucune clé n'est écrite dans le dépôt.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clé de signature (si les secrets sont configurés)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p signing
            echo "$KS_B64" | base64 -d > signing/upload.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n" "$KS_PW" "$KS_PW" "${KS_ALIAS:-ballal}" "$PWD/signing/upload.jks" > signing/key.properties
            echo "Signature officielle activée"
          else
            echo "Pas de clé configurée : signature de test"
          fi

      - name: Configuration vérifiée (secrets GitHub)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 tool/write_env.py env/ci.json

      - name: Générer les dossiers Android
        run: |
          flutter create --org com.amadoutechnology --project-name ballal --platforms android .
          python3 tool/setup_platforms.py

      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyse (erreurs bloquantes uniquement)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - name: Tests
        run: flutter test
        continue-on-error: true

      - name: Construire l'APK et le fichier Play Store (AAB)
        run: |
          flutter build apk --release --dart-define-from-file=env/ci.json --build-number=${{ github.run_number }}
          flutter build appbundle --release --dart-define-from-file=env/ci.json --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: ballal-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK (page Releases, lien direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk BALLAL.apk
          cp build/app/outputs/bundle/release/app-release.aab BALLAL-PlayStore.aab
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" BALLAL.apk BALLAL-PlayStore.aab --title "BALLAL – version de test ${{ github.run_number }}" \
            --notes "APK de test généré automatiquement depuis le commit ${{ github.sha }}." --latest
